# CI/CD pipeline: quality gate -> build -> deploy.
#
#   quality  - ESLint + full Vitest suite. If either fails, nothing deploys.
#   build    - production Vite build, uploaded as a Pages artifact.
#   deploy   - publishes the artifact to GitHub Pages.
#
# Requires: repo Settings -> Pages -> Source set to "GitHub Actions".
name: CI / Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allows manual runs from the Actions tab

permissions:
  contents: read
  pages: write      # needed to publish to Pages
  id-token: write   # needed for Pages OIDC deployment

# Cancel an in-progress deploy if a newer push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---- Quality gate: lint + tests must pass before anything builds ----
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  # ---- Build: only runs if the quality gate passed ----
  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ---- Deploy: publish to Pages, but never from pull requests ----
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
